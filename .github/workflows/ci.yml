name: CI Multi-Platform Matrix & Zero-Trust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-dotnet-windows:
    name: .NET 9 Client & Server (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SnakeUSBIP.sln

      - name: Build Release
        run: dotnet build SnakeUSBIP.sln -c Release --no-restore

      - name: Run Unit Tests (137 xUnit Tests)
        run: dotnet test SnakeUSBIP.sln -c Release --no-build --verbosity normal

  test-server-macos:
    name: Swift Server (macOS Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test Swift Server
        run: |
          cd server/src/SnakeUSBIP.Server.Mac
          swift build -c release
          swift test

      - name: Verify CLI Execution
        run: |
          cd server/src/SnakeUSBIP.Server.Mac
          .build/release/snakeusbip-server-mac help

  build-android:
    name: Android Server & Sunshine Handoff (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

