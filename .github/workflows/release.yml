name: Protected Release Pipeline (Zero-Cost FOSS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: false
        default: "v1.1.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Version
        id: vars
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          if ($inputTag) {
            $tag = $inputTag
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v1.0.0"
          }
          $version = $tag -replace '^v',''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install Obfuscar (Free MIT Tool)
        run: dotnet tool install -g obfuscar.globaltool

      - name: Build Protected Windows Packages
        shell: pwsh
        run: |
          ./tools/build-protected-ecosystem.ps1 -Version "${{ steps.vars.outputs.version }}" -OutputDir "${{ github.workspace }}/dist"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/installer/*
          if-no-files-found: error

  build-macos-server:
    name: Build macOS Server (Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Version
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Swift Server (Release)
        run: |
          cd server/src/SnakeUSBIP.Server.Mac
          swift build -c release

      - name: Package macOS Server Tarball
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          PKG_DIR="SnakeUSBIP-Server-macOS-v${VERSION}"
          mkdir -p "$PKG_DIR"
          cp server/src/SnakeUSBIP.Server.Mac/.build/release/snakeusbip-server-mac "$PKG_DIR/"
          cp server/scripts/install-server-mac.sh "$PKG_DIR/install.sh"
          cp server/scripts/uninstall-server-mac.sh "$PKG_DIR/uninstall.sh"
          cp LICENSE "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/snakeusbip-server-mac" "$PKG_DIR/install.sh" "$PKG_DIR/uninstall.sh"
          tar -czvf "SnakeUSBIP-Server-macOS-v${VERSION}.tar.gz" "$PKG_DIR"
          mkdir -p dist-mac
          mv "SnakeUSBIP-Server-macOS-v${VERSION}.tar.gz" dist-mac/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist-mac/*
          if-no-files-found: error

  build-linux-server:
    name: Build Linux Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Version
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Linux Server Suite
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          PKG_DIR="SnakeUSBIP-Server-Linux-v${VERSION}"
          mkdir -p "$PKG_DIR"
          cp server/scripts/snakeusbip-ctl "$PKG_DIR/"
          cp server/scripts/install-server-linux.sh "$PKG_DIR/install.sh"
          cp server/scripts/uninstall-server-linux.sh "$PKG_DIR/uninstall.sh"
          cp LICENSE "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          chmod +x "$PKG_DIR/snakeusbip-ctl" "$PKG_DIR/install.sh" "$PKG_DIR/uninstall.sh"
          tar -czvf "SnakeUSBIP-Server-Linux-v${VERSION}.tar.gz" "$PKG_DIR"
          mkdir -p dist-linux
          mv "SnakeUSBIP-Server-Linux-v${VERSION}.tar.gz" dist-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist-linux/*
          if-no-files-found: error

  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Version
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "Error: secret ANDROID_KEYSTORE_B64 is not configured"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: snakeusbip_release
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Package
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          mkdir -p dist-android
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*-release.apk" ! -name "*unsigned*" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist-android/SnakeUSBIP-Android-v${VERSION}.apk"
          else
            echo "Error: No signed release APK produced (refusing to publish debug/unsigned APK)"
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist-android/*
          if-no-files-found: error

  publish-release:
    name: Publish Official Multiplatform Release
    needs: [build-windows, build-macos-server, build-linux-server, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Version
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: final-dist
          merge-multiple: true

      - name: Consolidate distribution files & calculate SHA256SUMS.txt
        run: |
          cd final-dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== Manifest SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Generate GitHub Artifact Attestations (Sigstore $0)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "final-dist/*"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            final-dist/*
          name: "🐍 SnakeUSBIP ${{ steps.vars.outputs.tag }} — Official Multiplatform Release"
          generate_release_notes: true
          body: |
            ## 🐍 SnakeUSBIP ${{ steps.vars.outputs.tag }} — Multiplatform Ecosystem
            
            100% Free and Open Source (GNU GPLv3).
            Official hardened multiplatform builds published by `oscarlosu-lab`.
            
            ### 📦 Paquetes Oficiales Incluidos
            * **Windows Client**: `SnakeUSBIP_Setup_v${{ steps.vars.outputs.version }}.exe` (Instalador completo con drivers y filtros UDE)
            * **Windows Server**: `SnakeUSBIP-Server_Setup_v${{ steps.vars.outputs.version }}.exe` (Instalador dedicado para servidor Windows)
            * **Windows Portable**: `SnakeUSBIP_v${{ steps.vars.outputs.version }}_Portable_win-x64.zip` (Cliente + Servidor ReadyToRun sin instalación)
            * **macOS Server**: `SnakeUSBIP-Server-macOS-v${{ steps.vars.outputs.version }}.tar.gz` (Servidor Swift para Apple Silicon / Intel)
            * **Linux Client & Server**: `SnakeUSBIP-Server-Linux-v${{ steps.vars.outputs.version }}.tar.gz` (Cliente `vhci_hcd` + Servidor `usbip_host` universal y servicio systemd)
            * **Android App**: `SnakeUSBIP-Android-v${{ steps.vars.outputs.version }}.apk` (App servidor rootless para dispositivos Android)
            
            ### 🔒 Verificación Criptográfica de Integridad (SHA-256)
            Todos los binarios cuentan con atestación de procedencia **Sigstore ($0)** registrada públicamente:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
            
            ### ⚖️ Licencia y Marca
            * **SnakeUSBIP** es un proyecto de `oscarlosu-lab` bajo licencia **GNU GPLv3**.
            
            ---
            ☕ **Apoya este proyecto libre**: [Ko-fi](https://ko-fi.com/oscarlosu)
          draft: false
          prerelease: false
