name: Protected Release Pipeline (Zero-Cost FOSS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.2.0)"
        required: false
        default: "v3.2.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build Protected Packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version Tag
        id: vars
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          if ($inputTag) {
            $tag = $inputTag
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v3.2.0"
          }
          $version = $tag -replace '^v',''
          Write-Host "Resolved tag: $tag"
          Write-Host "Resolved version: $version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install Obfuscar (Free MIT Tool)
        run: dotnet tool install -g obfuscar.globaltool

      - name: Build Protected Packages
        shell: pwsh
        run: |
          ./tools/build-protected-ecosystem.ps1 -Version "${{ steps.vars.outputs.version }}" -OutputDir "./dist"

      - name: Generate GitHub Artifact Attestations (Sigstore $0)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/installer/*"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/installer/*
          name: "🐍 SnakeUSBIP ${{ steps.vars.outputs.tag }} — Official Free Release"
          body: |
            ## 🐍 SnakeUSBIP ${{ steps.vars.outputs.tag }}
            
            100% Free and Open Source (GNU GPLv3).
            Official builds hardened and published by `oscarlosu-lab`.
            
            ### 🔒 Verificación de Integridad (SHA-256)
            Todos los binarios cuentan con atestación criptográfica Sigstore y hashes públicos:
            ```powershell
            Get-FileHash .\[archivo] -Algorithm SHA256
            ```
            
            ### ⚖️ Licencia y Marca Registrada
            * **SnakeUSBIP** es una marca de `oscarlosu-lab`.
            * Distribuido bajo licencia **GNU GPLv3**. Prohibido cerrar el código o redistribuir binarios modificados bajo la marca SnakeUSBIP.
            
            ---
            ☕ **Apoya este proyecto libre**: [Ko-fi](https://ko-fi.com/oscarlosu)
          draft: false
          prerelease: false
