version: 2
updates:
  # Dependabot for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Dependabot for .NET Client
  - package-ecosystem: "nuget"
    directory: "/client/src/SnakeUSBIP"
    schedule:
      interval: "weekly"
    groups:
      nuget-client:
        patterns:
          - "*"

  # Dependabot for .NET Server
  - package-ecosystem: "nuget"
    directory: "/server/src/SnakeUSBIP.Server"
    schedule:
      interval: "weekly"
    groups:
      nuget-server:
        patterns:
          - "*"

  # Dependabot for Android App
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

